<style>
:root{--bg:#f3f4f5;--paper:#fff;--ink:#22272c;--text:#404a54;--muted:#838b93;--border:#e7e9ec;--soft:#f7f8f9;--accent:#1f292e;--green:#39816c;--mint:#e9f5ef;--amber:#a27a33;--amber-bg:#faf5e9;--shadow:0 5px 24px rgba(26,36,46,.025)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #5c8cb1;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.55}.shell{max-width:1320px;margin:0 auto;padding:32px 38px 22px;min-height:100vh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:23px}.identity{display:flex;align-items:center;gap:15px;min-width:0}.brand-icon{width:48px;height:48px;display:grid;place-items:center;background:#fff;border:1px solid var(--border);border-radius:15px;flex:none}.brand-icon svg{width:27px;height:27px}.brand-title{font-size:25px;line-height:1.22;letter-spacing:-.025em;font-weight:690}.brand-sub{color:var(--muted);font-size:12px;margin-top:4px}.toptools{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:11px}.status-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.status-dot{height:8px;width:8px;border-radius:50%;background:#c0a371}.status-dot.active{background:var(--green)}.powerbar{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:6px 7px 6px 12px;box-shadow:var(--shadow)}.power-label{color:#64707c;font-size:12px}.power-btn{border:0;background:var(--accent);color:#fff;font-weight:620;border-radius:9px;padding:10px 16px;display:flex;align-items:center;gap:7px}.power-btn.on{background:#57656c}.power-btn svg{width:17px;height:17px}.card{background:var(--paper);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow)}.runtime{padding:28px 30px 23px;margin-bottom:20px}.runtime-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.runtime-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:660}.runtime-title svg{width:21px;height:21px;color:#687784}.pill{border-radius:999px;padding:5px 10px;font-size:11px;background:#f1f2f3;color:#7d8791}.pill.olive{background:#ebf4ee;color:#3d7c64}.pill.amber{background:var(--amber-bg);color:var(--amber)}.runtime-model{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:15px;color:#485461}.runtime-model strong{font-weight:670}.runtime-model .sep{width:3px;height:3px;background:#b3bbc1;border-radius:100%}.metric-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:25px 0 0}.metric{min-width:0;background:var(--soft);border:1px solid #f0f1f2;border-radius:16px;padding:16px 17px;min-height:113px}.metric-value{font-size:32px;line-height:1.13;letter-spacing:-.035em;font-weight:680;font-variant-numeric:tabular-nums;white-space:nowrap}.metric-value small{font-size:13px;letter-spacing:0;font-weight:510;color:#7b858e;margin-left:5px}.metric-caption{font-size:12px;color:#828d97;margin-top:10px}.runtime-note{border-top:1px solid var(--border);margin-top:19px;padding-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:#89919a}.runtime-note strong{font-weight:550;color:#687580}.section-title{font-size:16px;letter-spacing:-.01em;font-weight:660;margin:0 0 16px}.section-sub{font-size:12px;color:var(--muted);margin:0}.hub{padding:28px 28px 24px;flex:1}.hub-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.hub-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}.hub-title svg{width:21px;height:21px}.hub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:26px;row-gap:9px}.feature{display:flex;gap:15px;align-items:center;min-height:87px;padding:14px 13px;border:1px solid transparent;border-radius:15px;text-align:left;background:transparent;color:inherit;width:100%;transition:background .15s,border-color .15s}.feature:hover{background:#f7f8f9;border-color:#edf0f2}.feature .ficon{flex:none;color:#7c858e}.ficon svg{width:24px;height:24px}.feature .fbody{flex:1;min-width:0}.feature-name{font-weight:650;font-size:16px;line-height:1.3}.feature-description{color:#9299a0;font-size:12px;margin-top:6px}.arrow{color:#c0c5cb;display:flex}.arrow svg{width:17px;height:17px}.footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:#98a0a8;font-size:11px;margin-top:auto;padding:23px 4px 0}.detail-head{display:flex;align-items:center;gap:15px;margin-bottom:19px}.back-btn{background:#fff;border:1px solid var(--border);border-radius:11px;padding:9px 12px;color:#526170;display:flex;gap:6px;align-items:center}.back-btn:hover,.btn.secondary:hover{background:#f8fafb}.detail-head .crumb{font-size:12px;color:#8a939d}.detail-title{font-size:29px;letter-spacing:-.025em;font-weight:710;margin:0 0 5px}.detail-subtitle{font-size:13px;color:var(--muted);margin-bottom:23px}.detail-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.71fr);gap:18px}.panel{background:#fff;border:1px solid var(--border);border-radius:20px;padding:26px 27px;min-width:0;margin-bottom:18px}.panel h2{font-size:16px;margin:0 0 20px;letter-spacing:-.01em}.panel h3{font-size:13px;margin:20px 0 12px}.field{margin:0 0 20px}.field:last-child{margin-bottom:0}.field label{font-size:13px;font-weight:590;display:block;margin-bottom:8px;color:#465460}.field input:not([type=checkbox]):not([type=range]),.field select,.field textarea{width:100%;border:1px solid #dfe4e8;background:#fcfdfd;border-radius:10px;padding:12px 13px;color:#303d4b;min-width:0;outline-offset:1px}.field small,.help{font-size:11px;color:#939ca5;display:block;line-height:1.65;margin-top:7px}.field .range-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.field input[type=range]{width:100%;accent-color:#4a7e73}.field .range-value{font-variant-numeric:tabular-nums;color:#4a6672}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row-label{font-weight:620}.row-detail{font-size:11px;color:#929ca5;margin-top:5px}.row-split{padding:14px 0;border-bottom:1px solid #f0f1f2;display:flex;align-items:center;justify-content:space-between;gap:15px}.row-split:first-of-type{padding-top:0}.row-split:last-child{border-bottom:0;padding-bottom:0}.switch{position:relative;flex:none;width:48px;height:28px;border-radius:18px;background:#d7dce0;border:0;transition:background .16s}.switch[aria-checked=true]{background:#5f987b}.switch:before{content:"";position:absolute;top:4px;left:4px;height:20px;width:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0002;transition:transform .16s}.switch[aria-checked=true]:before{transform:translateX(20px)}.choice{display:flex;flex-wrap:wrap;gap:8px}.choice button{background:#f7f8f9;border:1px solid #eaedef;color:#697580;padding:9px 13px;border-radius:10px;font-size:12px}.choice button.selected{background:#2e393f;color:#fff;border-color:#2e393f}.btn{border:0;border-radius:10px;padding:11px 15px;display:inline-flex;gap:7px;align-items:center;justify-content:center;font-weight:610;font-size:12px;white-space:nowrap}.btn svg{height:15px;width:15px}.btn.primary{background:#303b42;color:#fff}.btn.secondary{background:#fff;border:1px solid #dfe5e9;color:#586674}.btn.danger{background:#f7f0ee;color:#a26661}.action-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.note{background:#f7f8f9;border:1px solid #eff1f3;padding:14px 15px;border-radius:11px;font-size:12px;line-height:1.7;color:#6c7884}.note.warn{background:#fcf8ef;color:#8a7557;border-color:#f3ead9}.data-list{display:flex;flex-direction:column}.data-line{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid #eef1f3;padding:12px 0;font-size:12px}.data-line:last-child{border-bottom:none}.data-line span:first-child{color:#84909b}.data-line span:last-child{text-align:right;overflow-wrap:anywhere;color:#465768}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.mono-block{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;color:#60707d;background:#f7f8f9;border-radius:12px;font-size:12px;line-height:1.7}.small-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.smallmetric{padding:16px;background:#f7f8f9;border-radius:12px}.smallmetric b{font-size:24px;line-height:1.3;font-weight:700}.smallmetric span{color:#8b969f;font-size:11px}.progress{height:8px;background:#e9eef0;border-radius:999px;overflow:hidden;margin:12px 0}.progress > div{height:100%;background:#94a8b2}.logbox{background:#f7f8f9;border:1px solid #e9ecef;color:#607380;border-radius:12px;min-height:220px;padding:17px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:2;white-space:pre-wrap}.bench-bars{display:flex;flex-direction:column;gap:15px}.bench-row{display:grid;grid-template-columns:95px 1fr 55px;gap:12px;align-items:center;font-size:12px}.track{height:15px;background:#edf0f2;border-radius:5px;overflow:hidden}.fill{height:100%;background:#90a4b1}.fill.alt{background:#bccbd3}.preset{border:1px solid #e7eaec;border-radius:14px;padding:17px;margin-bottom:12px}.preset h3{margin:0 0 5px;font-size:15px}.preset p{color:#89939e;font-size:12px;margin:0 0 15px}.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:15px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:min(92vw,620px);padding:13px 19px;background:#293741;color:#fff;border-radius:12px;box-shadow:0 8px 28px #12202b25;z-index:5;font-size:12px;display:none}.toast.show{display:block}.demo-badge{background:#f2f4f5;padding:3px 8px;border-radius:7px;font-size:10px;color:#84919a;vertical-align:middle;margin-left:7px}.skeleton{color:#a4adb5}.hidden{display:none!important}
@media(max-width:1000px){.metric-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.detail-body{grid-template-columns:1fr 1fr}.shell{padding:25px 23px 18px}}@media(max-width:720px){.shell{padding:17px 14px}.top{align-items:flex-start}.brand-title{font-size:19px}.brand-sub{font-size:11px}.toptools{flex-direction:column;align-items:flex-end;gap:6px}.powerbar{padding:4px}.power-label{display:none}.power-btn{padding:9px 10px}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:13px}.metric-value{font-size:27px}.runtime{padding:20px}.hub{padding:19px}.hub-grid{grid-template-columns:1fr;gap:2px}.feature{min-height:72px}.detail-title{font-size:24px}.detail-body,.two-cols{grid-template-columns:1fr}.panel{padding:20px}.small-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){.brand-icon{width:40px;height:40px}.identity{gap:9px}.brand-title{font-size:17px}.brand-sub{max-width:190px}.metric-value{font-size:23px}.metric-value small{font-size:11px}.metric-caption{font-size:11px}.runtime-model{font-size:12px}.footer{font-size:10px}}
</style>
</head>
<body>
<div class="shell" id="shell">
<header class="top"><div class="identity"><div class="brand-icon" id="logo"></div><div><div class="brand-title">tqLLM Control Center</div><div class="brand-sub">Mac mini · Apple M5 Pro · 48 GB · 交互设计原型</div></div></div><div class="toptools"><div class="status-label"><i class="status-dot" id="status-dot"></i><span id="status-label">未连接本机 · 演示状态关闭</span></div><div class="powerbar"><span class="power-label">服务控制</span><button class="power-btn" id="power-toggle" aria-label="切换演示服务开关"></button></div></div></header>
<main id="main"></main>
<footer class="footer"><span>tqLLM Control Center · Interface Design v2</span><span>浅灰背景 · 白色卡片 · 原型</span></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const paths={sliders:'<path d="M4 7h16M4 17h16M9 4v6M15 14v6"/>',power:'<path d="M12 2v10M6.3 5.5a9 9 0 1 0 11.4 0"/>',layers:'<path d="m12 2 9 5-9 5-9-5 9-5Zm-9 10 9 5 9-5M3 17l9 5 9-5"/>',zap:'<path d="m13 2-9 11h7l-1 9 10-12h-7l1-8Z"/>',brain:'<circle cx="9" cy="7" r="3"/><circle cx="17" cy="7" r="3"/><path d="M9 10v7a4 4 0 0 0 4 4M17 10v7a4 4 0 0 1-4 4M5 13h4M17 13h3"/>',database:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 2 18 2 18 0V5M3 12c0 3 18 3 18 0"/>',network:'<rect x="10" y="2" width="4" height="4" rx="1"/><rect x="2" y="18" width="4" height="4" rx="1"/><rect x="10" y="18" width="4" height="4" rx="1"/><rect x="18" y="18" width="4" height="4" rx="1"/><path d="M12 6v7M4 18v-5h16v5M12 13v5"/>',activity:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',terminal:'<rect x="2" y="3" width="20" height="18" rx="3"/><path d="m6 9 4 3-4 3M12 16h5"/>',save:'<path d="M4 3h14l3 3v15H3V3h1Zm3 0v7h10V3M7 21v-8h10v8"/>',arrow:'<path d="m9 18 6-6-6-6"/>',back:'<path d="m15 18-6-6 6-6"/>',cpu:'<rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 1v4m6-4v4m-6 14v4m6-4v4M1 9h4m-4 6h4m14-6h4m-4 6h4"/>',check:'<path d="m4 12 5 5L20 6"/>',folder:'<path d="M3 7V5h7l2 3h9v12H3V7Z"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v6m0-10v1"/>',play:'<path d="m8 5 11 7-11 7V5Z"/>',refresh:'<path d="M20 7V3h-4M4 17v4h4M20 7a8 8 0 0 0-14-2M4 17a8 8 0 0 0 14 2"/>',book:'<path d="M3 5a3 3 0 0 1 3-3h15v18H6a3 3 0 0 0 0-6h15M3 5v12a3 3 0 0 0 3 3"/>'};
const icon=(name,size=22)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.info}</svg>`;
const items=[['service','power','服务控制','启动、停止、重启、自动启动'],['models','layers','模型管理','模型路径、导入、切换、草稿模型'],['qsa','zap','QSA 加速','开启、关闭、触发阈值'],['draft','brain','推测解码','DFlash2、Draft Max、Tree'],['context','database','上下文与缓存','Context、KV 精度、Prompt Cache'],['generation','sliders','生成参数','Temperature、Top-p、输出长度'],['api','network','API 服务','Host、Port、API Key、并发'],['performance','activity','实时性能','TTFT、Prefill、Decode、内存'],['logs','terminal','运行日志','实时日志、错误诊断、参数记录'],['presets','save','配置预设','快速模式、长上下文、性能测试']];
const defaults={binary:'/Users/xingbin/.tqllm/venv/bin/tqllm',modelDir:'/Volumes/移动硬盘/AI-Models/Qwen3.8-27B-QSA',modelFile:'',draftFile:'',qsaIndex:'',qsa:true,qsaFrom:49152,draftMode:'dflash2',draftMax:7,tree:true,context:131072,kv:'bf16',promptCache:false,memoryFit:true,temperature:0.7,topP:0.9,topK:40,maxTokens:4096,reasoning:true,host:'127.0.0.1',port:8086,apiKey:'',parallel:1,autoStart:false};
let config={...defaults},current='home',demoRunning=false,logsFilter='all',customPresets=[],sampleRounds=3;
try{const stored=localStorage.getItem('tqllm-prototype-v2');if(stored){const s=JSON.parse(stored);config={...defaults,...(s.config||{})};customPresets=Array.isArray(s.customPresets)?s.customPresets:[]}}catch(e){}
const main=document.getElementById('main');document.getElementById('logo').innerHTML=icon('sliders',27);
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const persist=()=>{try{const safe={...config,apiKey:''};localStorage.setItem('tqllm-prototype-v2',JSON.stringify({config:safe,customPresets:customPresets.map(p=>({...p,config:{...p.config,apiKey:''}}))}))}catch(err){}};
const note=(t,warning=false)=>`<div class="note${warning?' warn':''}">${t}</div>`;
const row=(name,value)=>`<div class="data-line"><span>${name}</span><span>${value}</span></div>`;
const field=(key,label,hint='',type='text')=>`<div class="field"><label for="f-${key}">${label}</label><input id="f-${key}" data-field="${key}" type="${type}" value="${e(config[key])}" ${type==='number'?'step="any"':''}>${hint?`<small>${hint}</small>`:''}</div>`;
const sel=(key,label,options,hint='')=>`<div class="field"><label for="f-${key}">${label}</label><select id="f-${key}" data-field="${key}">${options.map(([v,l])=>`<option value="${e(v)}" ${String(config[key])===String(v)?'selected':''}>${e(l)}</option>`).join('')}</select>${hint?`<small>${hint}</small>`:''}</div>`;
const switchRow=(key,title,desc='')=>`<div class="row-split"><div><div class="row-label">${title}</div>${desc?`<div class="row-detail">${desc}</div>`:''}</div><button type="button" class="switch" role="switch" aria-label="${title}" aria-checked="${!!config[key]}" data-switch="${key}"></button></div>`;
const choices=(key,title,opts,desc='')=>`<div class="field"><label>${title}</label><div class="choice">${opts.map(([v,l])=>`<button type="button" data-choice="${key}" data-value="${e(v)}" class="${String(config[key])===String(v)?'selected':''}">${e(l)}</button>`).join('')}</div>${desc?`<small>${desc}</small>`:''}</div>`;
const panel=(title,body)=>`<section class="panel"><h2>${title}</h2>${body}</section>`;
const action=(label,type='secondary',name='')=>`<button type="button" class="btn ${type}" data-action="${name}">${label}</button>`;
const metric=(num,unit,caption)=>`<div class="metric"><div class="metric-value">${num}<small>${unit}</small></div><div class="metric-caption">${caption}</div></div>`;
const head=(title,subtitle)=>`<div class="detail-head"><button class="back-btn" data-nav="home">${icon('back',16)} 返回总览</button><div class="crumb">功能设置 / ${title}</div></div><h1 class="detail-title">${title}</h1><p class="detail-subtitle">${subtitle}</p>`;
const wrapper=(left,right)=>`<div class="detail-body"><div>${left}</div><aside>${right}</aside></div>`;
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),3800)}
function renderPower(){const btn=document.getElementById('power-toggle');btn.classList.toggle('on',demoRunning);btn.innerHTML=icon('power',17)+(demoRunning?' 关闭服务':' 启动服务')+' <span class="demo-badge">演示</span>';document.getElementById('status-dot').classList.toggle('active',demoRunning);document.getElementById('status-label').textContent=demoRunning?'未连接本机 · 演示状态开启':'未连接本机 · 演示状态关闭'}
function home(){return `<section class="card runtime"><div class="runtime-heading"><div class="runtime-title">${icon('activity')} 模型运行情况</div><span class="pill amber">历史截图 · 非实时数据</span></div><div class="runtime-model"><strong>Qwen3.8-27B-QSA</strong><span class="sep"></span><span>tqLLM 1.6.0</span><span class="sep"></span><span>Apple M5 Pro</span></div><div class="metric-grid">${metric('31','tok/s','生成速度 · Answering')}${metric('341','tok/s','填充速度 · Prefill')}${metric('599','ms','首字延迟 · TTFT')}${metric('128K','','上下文上限 · Context')}${metric('18.3','GB','内存占用 · Memory')}</div><div class="runtime-note"><span><strong>历史快照</strong>　输入 198 Tokens · 已输出 1,679 Tokens</span><span>实时监测需接入 tqLLM 进程 / API</span></div></section>
<section class="card hub"><div class="hub-head"><div class="hub-title">${icon('sliders',22)} tqLLM Control Center</div><span class="pill">界面规划</span></div><div class="hub-grid">${items.map(x=>`<button class="feature" data-nav="${x[0]}"><div class="ficon">${icon(x[1])}</div><div class="fbody"><div class="feature-name">${x[2]}</div><div class="feature-description">${x[3]}</div></div><div class="arrow">${icon('arrow')}</div></button>`).join('')}</div></section>`}
function service(){return head('服务控制','在顶部工具栏中控制启动与停止，详细参数保留在此页面。')+wrapper(panel('启动环境',field('binary','tqLLM 可执行文件','来自历史安装记录；安装版需检测文件是否存在。')+switchRow('autoStart','登录时自动启动','本原型只保存选项，不会注册系统登录项。')+`<div class="action-row">${action(icon('info',15)+' 检查环境','secondary','check')}</div>`)+panel('启动策略',note('顶栏的启动/关闭按钮只是交互演示，不会运行、终止或重启 tqLLM 进程。真正执行前需要读取本机 CLI 能力和现有进程。',true)+`<div class="action-row">${action('模拟重启服务','secondary','restart')}</div>`),panel('当前设置',row('执行路径',`<span class="mono">${e(config.binary)}</span>`)+row('服务端口',`${e(config.host)}:${e(config.port)}`)+row('运行状态',demoRunning?'模拟已开启':'模拟未开启')+row('进程 PID','—')+row('可用 CLI 命令','待检测'))+panel('实施约束',note('启动、停止、重启应仅管理本控制器启动的进程；配置启动前进行路径、模型和端口检查。')))}
function models(){return head('模型管理','主模型、草稿模型和 QSA 文件分别选择；不猜测模型的真实文件结构。')+wrapper(panel('模型与目录',field('modelDir','模型存储目录','移动硬盘模型目录来自此前提供的信息。')+field('modelFile','主模型文件路径','应指向实际可加载的模型文件，而非单纯目录。')+field('draftFile','草稿模型路径','DFlash2 或兼容草稿模型；按当前引擎要求填写。')+field('qsaIndex','QSA 文件或索引路径','必须按所部署 tqLLM 的版本与模型结构核验。')+`<div class="action-row">${action(icon('folder',15)+' 扫描模型','primary','scan')}</div>`),panel('模型摘要',row('模型', 'Qwen3.8-27B-QSA（目录名称）')+row('模型文件','未扫描')+row('量化格式','未扫描')+row('QSA 索引状态','未验证')+row('草稿兼容性','未验证')+row('内存预估','未检测'))+panel('模型来源',note('“扫描模型”需本机文件系统权限；浏览器原型不直接读取 /Volumes 下的目录。')))}
function qsa(){return head('QSA 加速','按照长上下文触发阈值和模型兼容性配置，不把按钮状态冒充实际启用状态。')+wrapper(panel('稀疏注意力配置',switchRow('qsa','QSA 加速','仅适用于兼容 QSA 的模型与运行参数。')+choices('qsaFrom','QSA 触发阈值',[[32768,'32K'],[49152,'48K'],[65536,'64K'],[98304,'96K']],'阈值的实际解释以已安装版本为准。')+note('超过阈值不代表一定加速。索引、模型、运行时配置和测试上下文都必须满足条件。',true)+`<div class="action-row">${action('查看性能对照 →','secondary','performance')}</div>`),panel('生效前检查',row('主模型 QSA 索引','待验证')+row('QSA 运行时设置',config.qsa?'草案开启':'草案关闭')+row('触发阈值',`${config.qsaFrom.toLocaleString()} Tokens`)+row('长上下文实际命中','待测试')+row('回答质量对比','待测试'))+panel('注意',note('QSA 属于稀疏近似注意力；本界面必须区分已配置、已加载与实际触发三个状态。')))}
function draft(){return head('推测解码','草稿生成、验证策略和模型兼容性集中管理。')+wrapper(panel('解码方式',choices('draftMode','推测解码模式',[['dflash2','DFlash2'],['mtp','MTP'],['off','关闭']],'实际支持以已安装 tqLLM CLI、模型格式为准。')+field('draftMax','Draft Max · 草稿 Tokens 上限','建议在固定测试条件下比较不同长度。','number')+switchRow('tree','Tree Verification','树形验证策略，启动级参数通常需要重启。'))+panel('草稿模型关联',row('草稿模型文件',e(config.draftFile||'未设置'))+row('接受率','尚无测量')+row('平均草稿长度','尚无测量')+row('相对常规解码加速比','尚无测量'))+panel('调参原则',note('调大 Draft Max 不一定更快；真实速度取决于草稿接受率、验证开销、上下文长度及模型兼容性。')))}
function context(){return head('上下文与缓存','调整 Context、KV Cache 精度与缓存策略，兼顾统一内存。')+wrapper(panel('上下文窗口',choices('context','Context 长度',[[32768,'32K'],[65536,'64K'],[131072,'128K'],[262144,'256K']],'实际可用容量以模型与内存适配结果为准。')+choices('kv','KV Cache 精度',[['bf16','BF16'],['tq3','TQ3'],['q4','Q4']],'KV 缓存精度不等于模型权重量化。')+switchRow('promptCache','Prompt Cache','重复前缀复用，实际条件以运行时为准。')+switchRow('memoryFit','Memory Fit','按可用统一内存适配资源配置。')),
 panel('统一内存 · 历史截图',`<div class="smallmetric"><b>18.3 GB</b> <span>/ 48 GB</span><div class="progress"><div style="width:38.125%"></div></div><span>历史截图 · 非实时数据</span></div>`+row('当前实际内存','未连接')+row('KV 实际格式','待加载检测')+row('实际 Context', '待加载检测'))+panel('内存管理',note('设置值和实际加载值应分别显示：自动适配时，运行时可能调整可用上下文或缓存策略。')))}
function generation(){let obj={temperature:config.temperature,top_p:config.topP,top_k:Number(config.topK),max_tokens:Number(config.maxTokens),stream:true};return head('生成参数','仅对单次请求生效的采样参数，与启动级参数分开。')+wrapper(panel('采样设置',`<div class="field"><label for="f-temperature" class="range-head"><span>Temperature</span><span class="range-value">${Number(config.temperature).toFixed(2)}</span></label><input id="f-temperature" data-field="temperature" type="range" min="0" max="2" step="0.05" value="${config.temperature}"></div><div class="field"><label for="f-topP" class="range-head"><span>Top-p</span><span class="range-value">${Number(config.topP).toFixed(2)}</span></label><input id="f-topP" data-field="topP" type="range" min="0.05" max="1" step="0.05" value="${config.topP}"></div>`+field('topK','Top-k','','number')+field('maxTokens','最大输出 Tokens','','number')+switchRow('reasoning','思考模式','由模型能力及请求格式决定是否可用。')),
 panel('请求参数预览',`<pre class="mono-block">${e(JSON.stringify(obj,null,2))}</pre><div class="action-row">${action(icon('copy',15)+' 复制 JSON','secondary','copy-sampling')}</div>`)+panel('请求与引擎',note('采样参数不应错误映射成 tqLLM 启动选项；它们需要在实际请求中传递。')))}
function api(){let address=`http://${config.host}:${config.port}/v1`;return head('API 服务','本地监听、认证和并发访问配置。')+wrapper(panel('服务连接',`<div class="two-cols">${field('host','Host')}${field('port','Port','','number')}</div>`+field('apiKey','API Key（可选）','仅用于界面草案，密钥不写入浏览器本地存储。','password')+choices('parallel','并行请求槽',[[1,'1'],[2,'2'],[4,'4'],[8,'8']])+
 `<div class="action-row">${action('模拟检查连接','primary','connect')}</div>`),panel('连接地址',`<pre class="mono-block">${e(address)}</pre><div class="action-row">${action(icon('copy',15)+' 复制地址','secondary','copy-address')}</div>`+row('健康检测','GET /health')+row('模型列表','GET /v1/models')+row('聊天补全','POST /v1/chat/completions'))+panel('远程访问',note('通过 Tailscale 访问时，需核对监听地址、访问控制及密钥，不应默认暴露到公网。')))}
function performance(){return head('实时性能','运行版将读取实际状态；原型使用你提供的历史截图并清楚标注来源。')+wrapper(panel('tqLLM · 历史结果',`<div class="small-grid"><div class="smallmetric"><b>31</b> <span>tok/s</span><div class="help">Decode</div></div><div class="smallmetric"><b>341</b> <span>tok/s</span><div class="help">Prefill</div></div><div class="smallmetric"><b>599</b> <span>ms</span><div class="help">TTFT</div></div><div class="smallmetric"><b>18.3</b> <span>GB</span><div class="help">Memory</div></div></div>`+`<h3>历史生成速度对照</h3><div class="bench-bars"><div class="bench-row"><span>tqLLM</span><div class="track"><div class="fill" style="width:62%"></div></div><b>31.0</b></div><div class="bench-row"><span>Splash</span><div class="track"><div class="fill alt" style="width:80.6%"></div></div><b>40.3</b></div></div>`+`<p class="help">两次运行输入、输出长度不同，尚不构成严格同条件测评。</p>`),
 panel('基准测试设计',choices('testMode','测试类型',[['short','短上下文'],['long','64K / 128K'],['ab','QSA A/B']])+
 `<div class="field"><label>重复轮数</label><select id="rounds"><option value="3" ${sampleRounds===3?'selected':''}>3 次</option><option value="5" ${sampleRounds===5?'selected':''}>5 次</option><option value="10" ${sampleRounds===10?'selected':''}>10 次</option></select></div>`+`<div class="action-row">${action('生成测试方案','primary','copy-test')}</div>`+note('测试需固定模型、量化、请求内容、采样参数、上下文和输出上限；当前页面不会自动发起真实推理。'))+panel('需要观察的指标',row('TTFT / 首字','—')+row('Prefill tok/s','—')+row('Decode tok/s','—')+row('QSA 实际触发','—')+row('草稿接受率','—')))}
function logs(){return head('运行日志','查看真实 CLI 进程、启动事件和诊断信息的预留页面。')+wrapper(panel('日志查看器',`<div class="choice">${[['all','全部'],['startup','启动'],['requests','请求'],['errors','错误']].map(([v,l])=>`<button data-logfilter="${v}" class="${logsFilter===v?'selected':''}">${l}</button>`).join('')}</div><div class="logbox" style="margin-top:16px">[prototype] 未连接本机 tqLLM 进程。\n[prototype] ${e(logsFilter)} 日志筛选已选中。\n[prototype] 暂无真实日志。\n\n提示：接入后此处展示 stdout、stderr、启动参数及请求统计。</div><div class="action-row">${action('诊断清单','secondary','diagnostic')}</div>`),panel('运行前检查项',row('可执行文件','待本机检测')+row('模型文件','待本机检测')+row('API 监听端口','待本机检测')+row('权限与日志目录','待本机检测'))+panel('日志说明',note('避免制造虚假的成功事件。真实进程日志接入之前，这里仅展示界面占位和用户交互记录。')))}
function presets(){return head('配置预设','切换日常、长上下文、性能测试方案；可导出 JSON，便于继续开发。')+wrapper(panel('内置预设',`<div class="preset"><h3>日常交互</h3><p>32K · 普通问答 · 兼顾响应速度</p>${action('应用日常配置','secondary','preset-daily')}</div><div class="preset"><h3>长上下文 QSA</h3><p>128K · QSA 阈值 48K · 长文档任务</p>${action('应用长文本配置','secondary','preset-long')}</div><div class="preset"><h3>性能基准测试</h3><p>64K · 统一采样 · 建立无草稿基线</p>${action('应用测试配置','secondary','preset-bench')}</div>`),panel('自定义预设',`<div class="field"><label for="preset-name">配置名称</label><input id="preset-name" value="我的 M5 Pro 配置"></div><div class="action-row">${action('保存预设','primary','save-preset')}${action('导出 JSON','secondary','export-json')}</div><div id="custom-list">${customPresets.length?customPresets.map((p,i)=>`<div class="row-split"><span>${e(p.name)}</span>${action('应用','secondary',`custom-${i}`)}</div>`).join(''):'<p class="help">还没有自定义预设。</p>'}</div>`)+panel('导入配置',`<div class="field"><label for="json-import">选择先前导出的 JSON</label><input id="json-import" type="file" accept=".json,application/json"></div><p class="help">仅导入此原型中的设置值，不调用本机引擎。</p>`))}
function render(){renderPower();if(current==='home'){main.innerHTML=home();return;}const id=items.find(x=>x[0]===current);if(!id){current='home';main.innerHTML=home();return}main.innerHTML=({service,models,qsa,draft,context,generation,api,performance,logs,presets})[current]();}
function go(page){current=page;render();window.scrollTo({top:0,behavior:'instant'})}
function applyPreset(which){const all={daily:{context:32768,qsa:false,kv:'bf16',draftMode:'dflash2',draftMax:7,temperature:.7,maxTokens:4096},long:{context:131072,qsa:true,qsaFrom:49152,kv:'tq3',draftMode:'dflash2',draftMax:7,maxTokens:8192},bench:{context:65536,qsa:false,kv:'bf16',draftMode:'off',temperature:0,topP:1,maxTokens:4096}};config={...config,...all[which]};persist();render();toast('配置已应用到设计原型，未修改 tqLLM 服务。')}
const copy=(value)=>{if(navigator.clipboard?.writeText){navigator.clipboard.writeText(value).then(()=>toast('已复制到剪贴板。')).catch(()=>fallbackCopy(value));}else fallbackCopy(value)};
function fallbackCopy(value){const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('已复制到剪贴板。')}catch(e){toast('当前浏览器不允许复制，请手动复制。')}t.remove()}
function download(data,name){const blob=new Blob([data],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function handleAction(a){if(a==='scan'){toast('原型未读取外接硬盘。安装版需要文件访问权限。');return}if(a==='check'||a==='connect'){toast('此处仅为交互原型，未连接本机服务。');return}if(a==='restart'){demoRunning=true;render();toast('演示状态已重新开启，未操作本机进程。');return}if(a==='performance'){go('performance');return}if(a==='copy-sampling'){copy(JSON.stringify({temperature:config.temperature,top_p:config.topP,top_k:Number(config.topK),max_tokens:Number(config.maxTokens),stream:true},null,2));return}if(a==='copy-address'){copy(`http://${config.host}:${config.port}/v1`);return}if(a==='copy-test'){copy(JSON.stringify({name:'tqLLM 基准测试设计',mode:config.testMode||'short',repeat:sampleRounds,model_directory:config.modelDir,context:config.context,temperature:config.temperature,top_p:config.topP,max_tokens:config.maxTokens,compare_qsa:config.testMode==='ab',note:'仅测试方案，非已执行结果'},null,2));return}if(a==='diagnostic'){copy('tqLLM Control Center 诊断清单\n1. 检查 CLI 文件路径与版本\n2. 检查模型和 QSA 索引文件\n3. 检查端口监听与进程归属\n4. 检查启动参数及错误日志\n5. 检查服务 /health 和 /v1/models');return}if(a==='preset-daily'){applyPreset('daily');return}if(a==='preset-long'){applyPreset('long');return}if(a==='preset-bench'){applyPreset('bench');return}if(a==='save-preset'){const name=document.getElementById('preset-name')?.value.trim()||'未命名预设';customPresets.push({name,config:{...config,apiKey:''}});persist();render();toast(`已保存预设“${name}”到浏览器本地。`);return}if(a==='export-json'){download(JSON.stringify({format:'tqllm-control-center-prototype',version:2,config:{...config,apiKey:''},customPresets},null,2),'tqllm-control-center-config.json');toast('已导出 JSON（不包含 API Key）。');return}if(a.startsWith('custom-')){const p=customPresets[Number(a.slice(7))];if(p){config={...config,...p.config};persist();render();toast(`已应用“${p.name}”。`)}return}}
document.addEventListener('click',ev=>{const n=ev.target.closest('[data-nav]');if(n){go(n.dataset.nav);return}const sw=ev.target.closest('[data-switch]');if(sw){const k=sw.dataset.switch;config[k]=!config[k];persist();render();return}const c=ev.target.closest('[data-choice]');if(c){const k=c.dataset.choice;const v=c.dataset.value;config[k]=['qsaFrom','context','parallel'].includes(k)?Number(v):v;persist();render();return}const lf=ev.target.closest('[data-logfilter]');if(lf){logsFilter=lf.dataset.logfilter;render();return}const a=ev.target.closest('[data-action]');if(a){handleAction(a.dataset.action);return}if(ev.target.closest('#power-toggle')){demoRunning=!demoRunning;render();toast(`仅切换了演示状态；tqLLM 实际服务没有${demoRunning?'启动':'停止'}。`)}});
document.addEventListener('input',ev=>{const f=ev.target.closest('[data-field]');if(!f)return;const key=f.dataset.field;let v=f.value;if(['temperature','topP'].includes(key))v=Number(v);else if(['draftMax','topK','maxTokens','port'].includes(key))v=Number(v);config[key]=v;persist();if(f.type==='range')render();});
document.addEventListener('change',ev=>{const f=ev.target.closest('[data-field]');if(f&&f.type!=='range'){render();return}if(ev.target.matches('#rounds')){sampleRounds=Number(ev.target.value);return}if(ev.target.matches('#json-import')){const file=ev.target.files?.[0];if(!file)return;file.text().then(t=>{let x;try{x=JSON.parse(t)}catch(err){toast('导入失败：不是合法 JSON。');return}if(x.format!=='tqllm-control-center-prototype'||typeof x.config!=='object'){toast('不是该原型导出的配置文件。');return}config={...defaults,...x.config,apiKey:''};customPresets=Array.isArray(x.customPresets)?x.customPresets:[];persist();render();toast('配置已导入本原型，未写入 tqLLM。')}).catch(()=>toast('导入失败：无法读取文件。'))}});
render();
})();
</script>
